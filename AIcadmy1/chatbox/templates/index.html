<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Buddy</title>
    <style>
        /* --- CSS STYLING --- */
        /* This styles the chat interface */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9; 
            color: #333; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }

        #chat-container { 
            width: 90%; 
            max-width: 600px; 
            height: 80vh; 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column;
            border: 1px solid #e0e0e0;
        }

        #chat-header { 
            background: #5a4fcf; /* A slightly more modern purple */
            color: white; 
            padding: 16px; 
            border-radius: 12px 12px 0 0; 
            text-align: center; 
            font-size: 1.2em; 
            font-weight: 600;
        }

        #chat-box { 
            flex-grow: 1; 
            padding: 20px; 
            overflow-y: auto; 
        }

        .message { 
            margin-bottom: 15px; 
            display: flex; 
            flex-direction: column;
            max-width: 80%;
            line-height: 1.5;
        }

        .user { 
            align-self: flex-end; 
            background-color: #e9e7ff; 
            color: #333; 
            padding: 10px 15px; 
            border-radius: 20px 20px 5px 20px; 
        }

        .assistant { 
            align-self: flex-start; 
            background-color: #f1f1f1; 
            color: #333; 
            padding: 10px 15px; 
            border-radius: 20px 20px 20px 5px; 
        }

        #input-area { 
            display: flex; 
            padding: 15px;
            border-top: 1px solid #e0e0e0;
        }

        #user-input { 
            flex-grow: 1; 
            border: 1px solid #ddd; 
            padding: 12px; 
            border-radius: 20px; 
            outline: none; 
            font-size: 1em; 
            transition: border-color 0.3s;
        }
        #user-input:focus {
            border-color: #5a4fcf;
        }

        #send-btn { 
            background: #5a4fcf; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            margin-left: 10px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-size: 1em;
            font-weight: 600;
            transition: background-color 0.3s;
        }

        #send-btn:hover { 
            background: #4a40b3; 
        }
    </style>
</head>
<body>

<!-- --- HTML STRUCTURE --- -->
<!-- This is the main layout of the chat feature -->
<div id="chat-container">
    <div id="chat-header">AI Study Buddy</div>
    <div id="chat-box">
        <div class="message assistant">Hello! I'm your AI Study Buddy. What's on your mind today?</div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type your message...">
        <button id="send-btn">Send</button>
    </div>
</div>

<script>
    // --- JAVASCRIPT LOGIC ---
    // This makes the chat functional

    // Find the HTML elements we need to interact with
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    
    // This will store the full conversation history to maintain context
    let conversationHistory = [];

    /**
     * Sends a message to the backend and displays the response.
     */
    async function sendMessage() {
        const userMessage = userInput.value.trim();
        if (!userMessage) return; // Don't send empty messages

        // Display the user's message in the chatbox immediately
        addMessage(userMessage, 'user');
        userInput.value = ''; // Clear the input box

        try {
            // Send the user's message and history to our Flask backend
            const response = await fetch('http://127.0.0.1:5000/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: userMessage,
                    history: conversationHistory 
                })
            });

            if (!response.ok) {
                throw new Error('Network response was not ok');
            }

            const data = await response.json();
            
            // Update our local history with the full history from the server
            conversationHistory = data.history;
            
            // Display the latest AI response from the server
            addMessage(data.latest_response, 'assistant');

        } catch (error) {
            console.error('Error:', error);
            addMessage('Sorry, I am having trouble connecting. Please try again later.', 'assistant');
        }
    }

    /**
     * Adds a new message to the chat box.
     * @param {string} message - The message content.
     * @param {string} sender - 'user' or 'assistant'.
     */
    function addMessage(message, sender) {
        const messageElement = document.createElement('div');
        messageElement.classList.add('message', sender);
        messageElement.textContent = message;
        chatBox.appendChild(messageElement);
        // Automatically scroll to the newest message
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Add event listeners for the button click and 'Enter' key press
    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
</script>

</body>
</html>
